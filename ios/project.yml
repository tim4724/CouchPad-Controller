name: CouchPad
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  CouchPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CouchPad
        excludes:
          - "Resources"
      - path: CouchPad/Resources
        buildPhase: resources
    settings:
      base:
        # App Store identity, reverse-DNS of couchpad.games. Changed in the 2026-07
        # rebrand while the app was still unpublished — once a build reaches App Store
        # Connect the bundle id is frozen. It must match the AASA `appID`
        # (5ZH48MPAM3.games.couchpad.controller) on every Universal Link host.
        PRODUCT_BUNDLE_IDENTIFIER: games.couchpad.controller
        # Names the .app and the Swift module (hence $(PRODUCT_MODULE_NAME) below);
        # what the user actually sees is CFBundleDisplayName.
        PRODUCT_NAME: CouchPad
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        # Manual signing for BOTH configs with the App Store distribution
        # profile. This team has no registered devices, so automatic signing
        # can't mint the development profile it insists on. Debug only ever
        # builds for the simulator (CI screenshots), which isn't code-signed, so
        # the distribution profile is inert there; Release uses it for the
        # archive. The profile is bound to the explicit App ID
        # games.couchpad.controller carrying Associated Domains — set that up in
        # the portal, not here. The rebrand changed the bundle id, so that App ID
        # and its profile are NEW: create both, then keep the name below in sync
        # (Release builds fail on a profile name the portal doesn't know; Debug is
        # simulator-only and unsigned, so CI screenshots are unaffected).
        # Xcode-pane signing picks don't survive `xcodegen generate`; these do.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "CouchPad App Store"
        DEVELOPMENT_TEAM: 5ZH48MPAM3
      # Download size, Release only — Debug keeps the build-time-oriented defaults,
      # since it only ever builds for the simulator screenshot runs.
      configs:
        Release:
          # -Osize over -O: a launcher whose hot path is a WKWebView has no compute
          # to lose, and it trims the binary.
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          # AppIcon.icon is the only asset compiled per appearance (any/dark/tintable)
          # and per idiom, so it dominates Assets.car and is also the one place `space`
          # could visibly degrade output — eyeball the icon on device when changing it.
          ASSETCATALOG_COMPILER_OPTIMIZATION: space
    # Universal Links. Each host serves /.well-known/apple-app-site-association;
    # hexstacker.com scopes to the 6-char room code, couchpad.games adds the
    # legal pages (/privacy, /imprint, EN + default). The AASA room pattern is a
    # single exactly-6-char path segment — marketing pages fall through to the
    # browser, and JoinResolver rejects any 6-char non-room code at runtime.
    #
    # Apex and wildcard are listed separately, mirroring the two <data> hosts per
    # filter in AndroidManifest.xml: preview/branch deployments live on
    # subdomains (HexStacker's CI publishes main.hexstacker.com and
    # preview-<slug>.hexstacker.com), and JoinResolver already resolves those via
    # hostInDomain — only the OS-level claim was missing. Listing the apex
    # explicitly avoids depending on whether "*." is defined to cover it.
    # Every subdomain must serve its own AASA: Apple fetches it per-domain and
    # does not inherit from the apex. Both sites serve /.well-known independently
    # of Host (nginx server_name _, HexStacker's handler matches on path only),
    # so a new preview host is covered the moment it has TLS.
    #
    # This file is generated from the properties below (like the .xcodeproj) and is
    # gitignored; edit the list here, not the plist.
    # Associated Domains must also be enabled on the App ID in the Developer portal.
    entitlements:
      path: CouchPad/CouchPad.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:hexstacker.com
          - applinks:*.hexstacker.com
          - applinks:couchpad.games
          - applinks:*.couchpad.games
        # The App Clip below. Its App ID must be registered in the portal as an App
        # Clip of this one, which is what admits this key into the profile.
        com.apple.developer.associated-appclip-app-identifiers:
          - $(AppIdentifierPrefix)games.couchpad.controller.Clip
        # Shared with the clip, which lists the same group: carries the player's name
        # over when the full app replaces the clip (ProfileStore).
        com.apple.security.application-groups:
          - group.games.couchpad.controller
    # An on-demand-install-capable dependency is embedded under AppClips/, not built
    # as a plain framework dependency.
    dependencies:
      - target: CouchPadClip
    scheme:
      testTargets:
        - CouchPadUITests
    info:
      path: CouchPad/Info.plist
      properties:
        # Shared with the App Clip, which merges this and adds its own keys.
        <<: &appInfo
          CFBundleDisplayName: CouchPad
          CFBundleShortVersionString: "$(MARKETING_VERSION)"
          CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
          ITSAppUsesNonExemptEncryption: false
          # ATS: permit cleartext only to local, non-routable hosts (localhost, *.local,
          # RFC-1918 private IPv4 ranges) so a controller served off a dev machine on the
          # LAN can load over http. Public hosts keep full ATS. This exception is inert in
          # release: JoinResolver and the WebView navigation gate only ever produce an http
          # LAN navigation under #if DEBUG, so a release build never exercises it.
          NSAppTransportSecurity:
            NSAllowsLocalNetworking: true
          NSCameraUsageDescription: "CouchPad uses the camera to scan the room QR code shown on your TV."
          UILaunchScreen:
            UIColorName: LaunchBackground
          # The app-wide SUPERSET, not what any screen allows: landscape is listed only so
          # a controller page can ask for it (CONTRACT.md §10). The window's root view
          # controller narrows this per screen (RootHostingController.supportedInterface-
          # Orientations → ChromeState.orientation), and everything outside a game host —
          # home, scan, About — stays portrait. Dropping landscape here would make the §10
          # request a silent no-op; dropping the root VC's narrowing would let home rotate.
          UISupportedInterfaceOrientations:
            - UIInterfaceOrientationPortrait
            - UIInterfaceOrientationLandscapeLeft
            - UIInterfaceOrientationLandscapeRight
          UIRequiresFullScreen: true
          UIApplicationSceneManifest:
            UIApplicationSupportsMultipleScenes: false
            UISceneConfigurations:
              UIWindowSceneSessionRoleApplication:
                - UISceneConfigurationName: Default
                  UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        # Contract §8 only: browsing `_couchpad._tcp` for rooms advertised on the LAN,
        # so home can offer one-tap join, and advertising the room the player is in.
        # Asked from home's "Allow"; the games' direct WebRTC path needs no grant, since
        # WKWebView traffic is exempt from Local Network privacy. NSBonjourServices is
        # not just documentation — an undeclared type is filtered out and the browser
        # silently returns nothing. Both strings are localized in InfoPlist.xcstrings.
        NSLocalNetworkUsageDescription: "CouchPad uses your local network to find nearby rooms, so you can join without scanning a code."
        NSBonjourServices:
          - _couchpad._tcp
  # App Clip: a camera scan of a room link plays without an install. It is the whole
  # launcher compiled a second time with APPCLIP set — the invocation URL arrives as a
  # browsing-web user activity, exactly like a Universal Link, so SceneDelegate and the
  # join funnel need no clip path of their own. `#if APPCLIP` only removes what a clip
  # can't run: Bonjour (contract §8 discovery and advertising, and the Local Network
  # prompt that rides a browse), plus the full-app offer on returning home.
  CouchPadClip:
    type: application.on-demand-install-capable
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CouchPad
        excludes:
          - "Resources"
          # The app's own; the clip's are generated under CouchPadClip/ below.
          - "Info.plist"
          - "CouchPad.entitlements"
      - path: CouchPad/Resources
        buildPhase: resources
    settings:
      base:
        # Must be the parent's id plus one component; the AASA `appclips` entry on
        # every invocation host names 5ZH48MPAM3.games.couchpad.controller.Clip.
        PRODUCT_BUNDLE_IDENTIFIER: games.couchpad.controller.Clip
        PRODUCT_NAME: CouchPadClip
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPCLIP"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        # Signed like the app (see its comment), with the clip's own App Store profile
        # — keep this name in sync with ExportOptions.plist.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "CouchPad Clip App Store"
        DEVELOPMENT_TEAM: 5ZH48MPAM3
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          ASSETCATALOG_COMPILER_OPTIMIZATION: space
    # App Clip domains can't be wildcards, so each invocation host is listed — and
    # each serves an AASA whose `appclips.apps` names this clip. Which URLs actually
    # open the clip is decided by the App Clip experiences in App Store Connect.
    entitlements:
      path: CouchPadClip/CouchPadClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)games.couchpad.controller
        com.apple.developer.associated-domains:
          - appclips:hexstacker.com
          - appclips:couchpad.games
          - appclips:tinytrack.couchpad.games
        com.apple.security.application-groups:
          - group.games.couchpad.controller
    info:
      path: CouchPadClip/Info.plist
      properties:
        # Without the app's Local Network keys: a clip can't hold that access (TN3179).
        # The fastlane doesn't need it — WKWebView traffic is exempt, and on-device
        # stats with the permission denied show a host-candidate LAN pair.
        <<: *appInfo
        # XcodeGen fills this in for an application target but not for an
        # on-demand-install-capable one, and App Store Connect rejects a clip without it.
        CFBundlePackageType: APPL
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
  # Smoke test + store-screenshot capture (see StoreScreenshotTests.swift).
  CouchPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CouchPadUITests
    dependencies:
      - target: CouchPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.couchpad.controller.uitests
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: CouchPad
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
