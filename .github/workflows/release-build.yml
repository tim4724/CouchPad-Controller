# Builds the two store-ready, signed release artifacts:
#   - Android: .aab signed with the Play upload keystore (materialized from secrets;
#     see keystore.properties.example), uploaded as a workflow artifact. Tag builds
#     also publish it to Play's closed testing track via the Play API service
#     account, with the tag as versionName and the run number as versionCode.
#   - iOS: signed with the Apple Distribution cert + "CouchPad App Store" profile
#     (project.yml pins manual signing with exactly these). Tag builds upload
#     straight to TestFlight via the ASC API key with the tag as marketing version
#     (the TestFlight build IS the release candidate — no .ipa artifact);
#     workflow_dispatch builds export the .ipa as a workflow artifact instead.
#
# Runs on bare-semver release tags and on demand. Each signing step fails fast with
# a named error when its secrets are missing — the Android build would otherwise
# silently fall back to a debug-signed (store-rejected) artifact.
name: Release build

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # third_party/zxing-cpp is compiled from source by :app (see android/app/build.gradle.kts),
      # so the submodule has to be present or CMake configuration fails. Not recursive: zxing's
      # own zint submodule is unused.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Materialize upload keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed release bundle
        working-directory: android
        run: |
          # Play rejects a reused versionCode, so stamp a unique one; tag builds
          # take their versionName from the tag (bare semver), others keep
          # build.gradle.kts's. Both are -P overrides — the static values stay
          # untouched. (Mirrors the iOS Archive step below.)
          VERSION_ARGS=("-PcpVersionCode=$GITHUB_RUN_NUMBER")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_ARGS+=("-PcpVersionName=$GITHUB_REF_NAME")
          fi
          ./gradlew bundleRelease "${VERSION_ARGS[@]}"

      - name: Verify the AAB is signed with the upload key
        run: |
          CERT="$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab)"
          echo "$CERT"
          # Belt and suspenders on top of the fail-fast above: the Gradle script
          # debug-signs release builds whenever keystore.properties is unusable.
          if grep -q "CN=Android Debug" <<< "$CERT"; then
            echo "::error::AAB is debug-signed — upload keystore was not applied"
            exit 1
          fi

      # Before publishing, so a Play-side rejection still leaves the bundle
      # downloadable from the run.
      - uses: actions/upload-artifact@v7
        with:
          name: games.couchpad.controller-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Tags only, like the iOS TestFlight upload beside it — a dispatch stays
      # "build and hand me the artifact". mapping.txt goes with it or crash
      # reports from this R8 build are unreadable. "alpha" is the closed testing
      # track's API name (edits.tracks.list). Completed, not draft: testers
      # opted in, and Play still reviews the release — but it also means this
      # step fails until the Console setup tasks (listing, content rating, data
      # safety) are done. The service account needs "Release to testing tracks"
      # on this app in Play Console (Users and permissions, not Cloud IAM).
      - name: Publish to Play (closed testing)
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.couchpad.controller
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          tracks: alpha
          status: completed

  ios:
    name: iOS (IPA)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install xcodegen
        run: |
          # The runner image ships an untrusted aws/tap that brew warns about on
          # every invocation — drop it, we only need core.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Import distribution certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for v in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done

          # Throwaway keychain so nothing touches the runner's login keychain.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the imported key without a UI prompt (headless runner).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

          # Profiles must be UUID-named; cover the classic dir and the Xcode 16+ one.
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$UUID.mobileprovision"
          done

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          # ASC rejects reused build numbers, so stamp a unique one; tag builds
          # take their marketing version from the tag (bare semver), others keep
          # project.yml's. Both are xcodebuild-level overrides — project.yml's
          # static values stay untouched.
          VERSION_ARGS=("CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_ARGS+=("MARKETING_VERSION=$GITHUB_REF_NAME")
          fi
          xcodebuild archive \
            -project CouchPad.xcodeproj \
            -scheme CouchPad \
            -destination "generic/platform=iOS" \
            -archivePath build/CouchPad.xcarchive \
            "${VERSION_ARGS[@]}"

      - name: Export signed IPA (dispatch) or upload to TestFlight (tag)
        working-directory: ios
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          EXPORT_ARGS=(-archivePath build/CouchPad.xcarchive -exportOptionsPlist ExportOptions.plist)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            for v in ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
              [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
            done
            plutil -replace destination -string upload ExportOptions.plist
            echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            EXPORT_ARGS+=(-authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
                          -authenticationKeyID "$ASC_API_KEY_ID"
                          -authenticationKeyIssuerID "$ASC_API_ISSUER_ID")
          else
            EXPORT_ARGS+=(-exportPath build/export)
          fi
          xcodebuild -exportArchive "${EXPORT_ARGS[@]}"

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: games.couchpad.controller-release-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error

      # Keep the debug symbols with the build — needed to symbolicate crash
      # reports for exactly this binary.
      - uses: actions/upload-artifact@v7
        with:
          name: games.couchpad.controller-release-dsyms
          path: ios/build/CouchPad.xcarchive/dSYMs
          if-no-files-found: error
