name: CouchPad
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  CouchPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CouchPad
        excludes:
          - "Resources"
      - path: CouchPad/Resources
        buildPhase: resources
    settings:
      base:
        # App Store identity, reverse-DNS of couchpad.games. Changed in the 2026-07
        # rebrand while the app was still unpublished — once a build reaches App Store
        # Connect the bundle id is frozen. It must match the AASA `appID`
        # (5ZH48MPAM3.games.couchpad.controller) on every Universal Link host.
        PRODUCT_BUNDLE_IDENTIFIER: games.couchpad.controller
        # Names the .app and the Swift module (hence $(PRODUCT_MODULE_NAME) below);
        # what the user actually sees is CFBundleDisplayName.
        PRODUCT_NAME: CouchPad
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        # Manual signing for BOTH configs with the App Store distribution
        # profile. This team has no registered devices, so automatic signing
        # can't mint the development profile it insists on. Debug only ever
        # builds for the simulator (CI screenshots), which isn't code-signed, so
        # the distribution profile is inert there; Release uses it for the
        # archive. The profile is bound to the explicit App ID
        # games.couchpad.controller carrying Associated Domains — set that up in
        # the portal, not here. The rebrand changed the bundle id, so that App ID
        # and its profile are NEW: create both, then keep the name below in sync
        # (Release builds fail on a profile name the portal doesn't know; Debug is
        # simulator-only and unsigned, so CI screenshots are unaffected).
        # Xcode-pane signing picks don't survive `xcodegen generate`; these do.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "CouchPad App Store"
        DEVELOPMENT_TEAM: 5ZH48MPAM3
    # Universal Links. Each host serves /.well-known/apple-app-site-association;
    # hexstacker.com scopes to the 6-char room code, couchpad.games adds the
    # legal pages (/privacy, /imprint, EN + default). The AASA room pattern is a
    # single exactly-6-char path segment — marketing pages fall through to the
    # browser, and JoinResolver rejects any 6-char non-room code at runtime.
    #
    # Apex and wildcard are listed separately, mirroring the two <data> hosts per
    # filter in AndroidManifest.xml: preview/branch deployments live on
    # subdomains (HexStacker's CI publishes main.hexstacker.com and
    # preview-<slug>.hexstacker.com), and JoinResolver already resolves those via
    # hostInDomain — only the OS-level claim was missing. Listing the apex
    # explicitly avoids depending on whether "*." is defined to cover it.
    # Every subdomain must serve its own AASA: Apple fetches it per-domain and
    # does not inherit from the apex. Both sites serve /.well-known independently
    # of Host (nginx server_name _, HexStacker's handler matches on path only),
    # so a new preview host is covered the moment it has TLS.
    #
    # This file is generated from the properties below (like the .xcodeproj) and is
    # gitignored; edit the list here, not the plist.
    # Associated Domains must also be enabled on the App ID in the Developer portal.
    entitlements:
      path: CouchPad/CouchPad.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:hexstacker.com
          - applinks:*.hexstacker.com
          - applinks:couchpad.games
          - applinks:*.couchpad.games
    scheme:
      testTargets:
        - CouchPadUITests
    info:
      path: CouchPad/Info.plist
      properties:
        CFBundleDisplayName: CouchPad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # ATS: permit cleartext only to local, non-routable hosts (localhost, *.local,
        # RFC-1918 private IPv4 ranges) so a controller served off a dev machine on the
        # LAN can load over http. Public hosts keep full ATS. This exception is inert in
        # release: JoinResolver and the WebView navigation gate only ever produce an http
        # LAN navigation under #if DEBUG, so a release build never exercises it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "CouchPad uses the camera to scan the room QR code shown on your TV."
        # Contract §8 room discovery: browse `_couchpad._tcp` for native display apps
        # advertising a room, so home can offer one-tap join. NSBonjourServices is not
        # just documentation — an undeclared type is filtered out and the browser
        # silently returns nothing. Both strings are localized in InfoPlist.xcstrings.
        NSLocalNetworkUsageDescription: "CouchPad looks for CouchPad games on your TV so you can join without scanning a code."
        NSBonjourServices:
          - _couchpad._tcp
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The app-wide SUPERSET, not what any screen allows: landscape is listed only so
        # a controller page can ask for it (CONTRACT.md §10). The window's root view
        # controller narrows this per screen (RootHostingController.supportedInterface-
        # Orientations → ChromeState.orientation), and everything outside a game host —
        # home, scan, About — stays portrait. Dropping landscape here would make the §10
        # request a silent no-op; dropping the root VC's narrowing would let home rotate.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
  # Smoke test + store-screenshot capture (see StoreScreenshotTests.swift).
  CouchPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CouchPadUITests
    dependencies:
      - target: CouchPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.couchpad.controller.uitests
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: CouchPad
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
